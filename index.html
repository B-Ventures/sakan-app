<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Building Payments Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/000000/building.png" />
    <script>
      // Capture PWA install prompt early to prevent missing it before React compiles or mounts
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        if (typeof window.onBeforeInstallPromptCaptured === 'function') {
          window.onBeforeInstallPromptCaptured(e);
        }
      });

      // Clear development service workers and caches early to prevent white screen caching issues
      (function() {
        var isDev = window.location.hostname === 'localhost' || 
                    window.location.hostname.endsWith('.run.app') || 
                    window.location.hostname.includes('aistudio');
        if (isDev) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
                console.log('Early dev SW unregistered');
              }
            }).catch(function(err) { console.error('Early SW unregister error:', err); });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
                console.log('Early dev cache deleted:', keys[i]);
              }
            }).catch(function(err) { console.error('Early cache delete error:', err); });
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
